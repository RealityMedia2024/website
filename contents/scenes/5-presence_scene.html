    <a-entity id="Definitions_Presence" position="8.93 4.40203 0.74323" rotation="0 -90 0">
      <a-entity text="color: white; letterSpacing: 2; baseline: top; lineHeight: 55; value: What is Presence?; width: 10; anchor: left; wrapCount: 34.42" position="-5.5131 -1.2455 0">
      </a-entity><a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: To look further, Lombard and Ditton's classification of presence is useful. They grouped definitions of presence into two categories:; width: 3; anchor: left; wrapCount: 34.42" position="0.31652 -2.27 0">
      </a-entity><a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: Presence is a kind of absence, the absence of mediation. If the users can forget that the medium is there, then they feel presence.; width: 5.3; anchor: left" position="-5.42951 -1.94121 0">
      </a-entity><a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: (1) individual perception of the world \n  (2) social interaction and engagement with others \n\n      The first category includes presence as transportation, as immersion and as realism. \n\n; width: 3; anchor: left" position="3.68077 -2.474 0">
      </a-entity>
    </a-entity>

    <a-entity id="Quote5" position="5.62312 1.72707 -19.43914" rotation="">
      <a-entity text="color: white; letterSpacing: 5; lineHeight: 60; value: Each reality medium strives to achieve presence, and each one falls short.; width: 4.22; wrapCount: 45.39; align: center" position="">

    <a-entity id="Absence" position="-8.95734 3.35582 -10.43416" rotation="0 90 0">
      <a-entity text="color: white; letterSpacing: 2.58; lineHeight: 60; value: These definitions circle around one core idea:; width: 3.42; wrapCount: 27.94; anchor: left; baseline: top" position="-0.42106 -0.1706 0">
      </a-entity><a-entity text="color: white; letterSpacing: 3; lineHeight: 60; value: that; width: 4.06; wrapCount: 32; anchor: left; baseline: bottom" position="-0.38346 -1.263 0">
      </a-entity><a-entity text="color: white; letterSpacing: 5; lineHeight: 60; value: presence; width: 6.29; wrapCount: 32; anchor: left; baseline: bottom" position="0.15914 -1.263 0">
      </a-entity><a-entity text="color: white; letterSpacing: 3; lineHeight: 60; value: is a kind of; width: 4.06; wrapCount: 32; anchor: left; baseline: bottom" position="0.75634 -1.748 0">
      </a-entity><a-entity text="color: white; letterSpacing: 5; lineHeight: 60; value: absence; width: 6.29; wrapCount: 32; anchor: left; baseline: bottom" position="2.10227 -1.76154 0">
      </a-entity><a-entity text="color: white; letterSpacing: 5; lineHeight: 60; value: Presence as transportation, immersion, or realism all come down to the user's forgetting that the medium is there.; width: 3.17; wrapCount: 32; anchor: left; baseline: bottom" position="4.83514 -1.748 0">
      </a-entity>
    </a-entity>

   <a-entity id="Milk_info" position="-27.39488 2.885 8.63315" rotation="0 90 0">
    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: Ultimate Empathy Machine; width: 4.04; anchor: left; wrapCount: 27.72" position="-0.63999 0.45326 0">
    </a-entity>
    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: 360 degree film Clouds Over Sidra created by Chris Milk and Gabo Arora shows the life of Syrian refugees in Za'atari camp in Jordan. The camera follows 12-year old Sidra in her everyday life, allowing the users to be present with Sidra.; width: 2.91; anchor: left; wrapCount: 45.9" position="1.45647 -0.00502 0">
    </a-entity><a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: When you are inside of the headset . . . you see full 360 degrees, in all directions. And when you are sitting there in her room, watching her, you are not watching it through a television screen, you are not watching it through a window, you are sitting there with her. When you look down, you are sitting on the same ground that she is sitting on. And because of that, you feel her humanity in a deeper way. You empathize with her in a deeper way. (Milk 2015); width: 2.61; anchor: left; wrapCount: 51.22" position="2.02154 -0.96439 0">
    </a-entity>
  </a-entity>

  <a-entity id="Empathy" position="-27.39488 1.69038 -5.6853" rotation="0 90 0">
    <a-entity text="color: #ffffff; letterSpacing: 1.67; lineHeight: 42.85; value: Presence and Empathy; width: 10.05; wrapCount: 30; font: https://cdn.aframe.io/fonts/KelsonSans.fnt; transparent: false; alphaTest: 0.75; align: center" position="2.69054 1.63505 0" scale="">
    </a-entity>

    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 60; value: Researchers have long pursued the idea of emotional reactions such as empathy as a test of presence.; width: 3.18; anchor: left; wrapCount: 35" position="-0.97371 0.67855 0">
    </a-entity><a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 60; value: VR is understood as getting us closer to the authentic or the real. But forgetting the medium is not necessary for a sense of presence. Presence can be understood in a more nuanced way as a liminal zone between forgetting and acknowledging VR as a medium.; width: 3.5; anchor: left; wrapCount: 39.78" position="2.70015 0.67197 0">
    </a-entity>
  </a-entity>

 <a-entity id="Nonnie_info" position="-23.75191 2.15759 -19.90428" rotation="">
  <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: The future of news?; width: 4.04; anchor: left; wrapCount: 27.72" position="-1.48273 0.52603 0">
  </a-entity>
  <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: Ted Talk called 'The future of news?''  introduces a new form of journalism where Virtual Reality technology is used to put audience inside the stories. In her work, she created VR stories about imprisonment in Guantanamo and hunger in Los Angeles to induce empathy in the audience.; width: 3.4; anchor: left; wrapCount: 45.9" position="-1.46382 -0.06729 0">
  </a-entity>
</a-entity>

<a-entity id="cybersickness" position="-9.41 2.60088 -17.043" rotation="0 -90 0">
  <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: Cybersickness and the negation of presence; width: 4.04; anchor: left; wrapCount: 27.72; align: right" position="-2.35521 0.96417 0">
  </a-entity>
  <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: The term cybersickness, or visually induced motion sickness, has been coined to describe symptoms including headache, nausea, eye strain, dizziness, fatigue, or even vomiting that may occur during or after exposure to a virtual environment. Cybersickness is visceral evidence that VR is not the medium to end all media. Cybersickness reminds the susceptible user of the medium in a powerful way. Nausea replaces astonishment.; width: 3.4; anchor: left; wrapCount: 45.9; align: right" position="-1.68291 0.19244 0">
  </a-entity>
</a-entity>

  <a-entity id="Pit_Experiment" position="-12.12469 2.50541 9.943" rotation="-180 0 -180">
    <a-entity text="color: white; letterSpacing: 3.2; baseline: top; lineHeight: 55; value: Pit Experiement; width: 6.17; anchor: left; wrapCount: 27.72" position="-1.5102 0.7862 0">
    </a-entity>
    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: The Pit experiments were conducted by researchers at the University of North Carolina in the early 2000s, to establish empirical evidence of presence in virtual reality. They constructed a physical set, complete with platforms and walls, that matched the virtual scene.; width: 2.5; anchor: left; wrapCount: 30" position="-1.46382 0.2072 0">
    </a-entity><a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: The subjects were asked to perform simple tasks that involved walking to the edge of a virtual pit. Researchers measured their physiological reactions to see if they experienced signs of fear, such as an accelerated heart beat.; width: 2.5; anchor: left; wrapCount: 30" position="1.24909 0.2072 0">
    </a-entity>
  </a-entity>

  <a-image id="PitAR_img" src="#PitAR_img_src" position="-19.28373 2.38179 9.89385" rotation="-180 0 -180" scale="2.34 2.74 2" material="" geometry="width: 0.8"></a-image>

  <a-gltf-model id="PitAR_img_frame" src="#frame" position="-19.27715 2.36756 9.94989" gltf-model="../../assets/scene/1-realitymedia/simple_picture.glb" rotation="0 0 90" scale="2.38 1.33 1"></a-gltf-model>



<a-entity id="Pit_AR" position="-22.31237 3.031 9.993" rotation="-180 0 -180">
    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: Presence in AR; width: 6.27; anchor: left; wrapCount: 27.72" position="-1.51731 0.69385 0">
    </a-entity>
    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: This experiment was inspired by the VR pit experiment described on the wall to your left. The subjects wore AR headsets instead of VR ones. They could see the room around them, but the pit itself was still virtual. \n\n Would the subjects would feel the same measurable anxiety in AR as in VR?; width: 2.5; anchor: left; wrapCount: 30" position="-1.46382 0.15556 0">
    </a-entity><a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 57.35; value: The subjects filled out a questionnaire after the experience and indicated that they did have a feeling of presence, but in this case, unlike in the VR experiment, the physiological data (heart rate etc.) did not indicate a response.; width: 2.5; anchor: left; wrapCount: 30" position="1.42857 -0.24615 0">
    </a-entity>
    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: Gandy, Maribeth, et al. 2010. “Experiences with an AR Evaluation Test Bed: Presence, Performance, and Physiological Measurement.” In 2010 IEEE International Symposium on Mixed and Augmented Reality, 127–36. Seoul, Korea (South): IEEE. https://doi.org/10.1109/ISMAR.2010.5643560.; width: 1.06; anchor: left; wrapCount: 30; align: right" position="-5.36932 -1.15669 0">
    </a-entity>
  </a-entity>


  <a-entity id="meehan_quote" text="color: white; letterSpacing: 5; lineHeight: 55; value: In order to study a VE’s effectiveness in evoking presence, researchers need a well designed and verified measure of the phenomena. \n\n Meehan et al.; width: 3.84; wrapCount: 50; align: center" position="-12.62092 1.7 -19.98084">
  </a-entity>

  <!-- Space 3: Aura -->
  <a-entity id="Aura" position="-27.385 2.5894 -29.47053" rotation="0 90 0">
    <a-entity text="color: white; letterSpacing: 0.99; baseline: top; lineHeight: 55; value: Portal \n to Acropolis; width: 1.77; anchor: left; wrapCount: 10.73; align: center" position="-7.37937 1.2774 0">
    </a-entity>
    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: Aura; width: 21.98; anchor: left; wrapCount: 27.72" position="-3.99803 1.45282 0">
    </a-entity>
    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: In 1930s, Walter Benjamin introduced the concept of aura in The Work of Art in the Age of Mechanical Reproduction. Aura is the here and now that work possesses because of its unique history of production and transmission.; width: 4.9; anchor: left; wrapCount: 46.14" position="-3.81766 0 0">
    </a-entity><a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: AR applications are not perfect reproductive technologies, as some draw on the physical and cultural uniquesness, the here and now of particular places.; width: 4.2; anchor: left; wrapCount: 38.55" position="1.53124 0 0">
    </a-entity>
  </a-entity>

  <a-entity id="TerraCotta" position="-27.385 2.56916 -42.08699" rotation="0 90 0">
    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: Terracotta Warriors AR; width: 4.04; anchor: left; wrapCount: 27.72" position="0 0.42082 0">
    </a-entity>
    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: The Franklin Institute in Philadelphia offered a mobile AR experience for their Terracotta Warrior exhibition. The app allowed visitors to use their smartphones to scan items and view various AR content to learn  more about the history behind the clay soldiers.; width: 3.64; anchor: left; wrapCount: 45.9" position="">

    <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: AR experiences generally lack aura, but AR experiences for cultural heritage can borrow or even enhance the aura of place.; width: 4.14; anchor: left; wrapCount: 45.9; align: center" position="">

  <a-entity id="AR_Quote1" position="-9.52552 2.91512 -32.20091" rotation="-180 90 -180">
    <a-entity text="color: white; letterSpacing: 5; lineHeight: 60; value: When AR is used for visiting a museum, a historic home, or an archaeological site, it is taking advantage of the aura of those places.; width: 6; wrapCount: 45.91; align: center" position="">

  <a-entity id="AR_Quote2" position="-9.40516 2.93897 -25.3745" rotation="-180 90 -180">
