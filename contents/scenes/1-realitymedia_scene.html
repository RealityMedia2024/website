      <a-entity id="welcome_title_txt" position="-4.79101 2.1 -0.76187" rotation="0 90 0">
        <a-entity position="0.18954 0.47498 0" text="color: white; align: center; letterSpacing: 0.62; lineHeight: 55; value: Welcome to Reality Media; baseline: top; width: 6; anchor: left; wrapCount: 30; xOffset: -1.14">
        </a-entity>
      </a-entity>

      <a-entity id="welcome_txt" position="-4.79101 2.1 -0.755" rotation="0 90 0">
        <a-entity  text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; 
        value: Reality Media is a project encompassing three writing spaces, three technologies for representing ideas: print, the web, and immersive VR. The printed page is a writing space with a tradition dating back to the fifteenth century (in Europe, much earlier in China). Obviously the web has a far shorter tradition, beginning around 1990. But in the thirty year since Tim Berners-Lee launched the first web server, the web has grown to rival print for many kinds of communication. The technologies for creating 3D graphic spaces in VR (and AR) actually predate the web. But only in the past 10 years have AR and VR become widely available media. The goal of RealityMedia is to demonstrate the potential range of AR and VR as communicative forms.; 
        width: 3; anchor: left; wrapCount: 65;">
        </a-entity>
      </a-entity>

      <a-entity id="Overview" position="-4.79101 2.1 -3.894" rotation="0 90 0">
      
        <a-entity  text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; 
        value: Each gallery in this “immersive book” corresponds to one or more chapters in the printed book and illustrates the themes of the printed chapter(s). (See the map on the far wall for the names/themes of the galleries.) For example, the gallery entitled “Presence” illustrates both presence and the related concept of aura and how computer scientists as well as filmmakers and designers have tried to evoke these reactions in visitors to their immersive applications.; 
        width: 3; anchor: left; wrapCount: 65">
        </a-entity>
    </a-entity>

      width: 1.5; anchor: left; wrapCount: 32.5;">
      </a-entity>
     </a-entity>

      <a-entity id="VirtualityContinuum" position="4.20064 2.10507 -6.72829" rotation="0 -90 0">

        <a-gltf-model src="#frame" position="1.20732 -0.48797 -0.0057" gltf-model="assets/General/simple_picture.glb" rotation="0 -180 90" scale="0.84 1.45 1"></a-gltf-model>
        <a-entity text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; value: In the 1990s, when both VR and AR were still laboratory technologies, two researchers, Paul Milgram and Fumio Kishino, diagrammed what they called the virtuality continuum, a spectrum with the real environment the physical world at one end and the complete virtual environment at the other. Milgram and Kishino 1994. Milgram et al. 1995. They placed augmented reality and augmented virtuality as intermediate points between these endpoints.; width: 1.95; anchor: left; wrapCount: 41.75" position="2.54605 -0.0382 0">
